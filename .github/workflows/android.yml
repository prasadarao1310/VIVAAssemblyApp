name: Build VIVA Assembly APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viva-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: viva-assembly-debug-signing-v1
      - name: Test, lint and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Check live news feeds
        continue-on-error: true
        run: |
          mkdir -p /tmp/viva-feed-probe
          javac -d /tmp/viva-feed-probe app/src/main/java/in/viva/assembly/DayContent.java app/src/main/java/in/viva/assembly/ObservanceNotes.java app/src/main/java/in/viva/assembly/NewsEngine.java tools/ServiceProbe.java
          java -cp /tmp/viva-feed-probe in.viva.assembly.ServiceProbe
          python3 - <<'PY'
          import json, urllib.request
          url = "https://api.open-meteo.com/v1/forecast?latitude=16.36&longitude=80.53&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FKolkata&forecast_days=16"
          data = json.load(urllib.request.urlopen(url, timeout=20))
          print("Weather:", len(data["daily"]["time"]), "forecast days; timezone:", data["timezone"])
          PY
      - name: Verify and package
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/VIVA-Assembly-0.2.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs deliverables/VIVA-Assembly-0.2.0.apk > deliverables/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging deliverables/VIVA-Assembly-0.2.0.apk > deliverables/apk-info.txt
          cd deliverables
          sha256sum VIVA-Assembly-0.2.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VIVA-Assembly-Android-APK
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
